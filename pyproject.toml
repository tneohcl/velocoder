[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "velocoder"
dynamic = ["version"]
description = "Desktop video transcoder: HEVC/H.264 on the CPU, an Intel iGPU or an AMD GPU, built on ffmpeg"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "ODCS App Studio" }]
requires-python = ">=3.12"
dependencies = ["PySide6>=6.11"]

[project.urls]
Homepage = "https://github.com/tneohcl/velocoder"

[project.gui-scripts]
velocoder = "velocoder.ui.main_window:main"

[tool.setuptools.dynamic]
version = { attr = "velocoder.APP_VERSION" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
velocoder = ["help/*.md", "help/*.json", "help/images/*"]
"velocoder.core" = ["*.json"]
"velocoder.ui" = ["assets/*"]
"velocoder.ui._vendor" = ["ODCS_UI_VERSION"]
"velocoder.ui._vendor.odcs_ui" = ["*.json", "*.qss", "LICENSE"]
